<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Andre Destro — iOS Developer</title>

  <link rel="canonical" href="https://andredestro.github.io/" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />

  <!-- SEO -->
  <meta name="description" content="Andre Destro is an iOS developer building simple, fast and useful apps for everyday life — including Sleep Wave, Hydro, ProteinLog and more." />
  <meta name="author" content="Andre Destro" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://andredestro.github.io/" />
  <meta property="og:title" content="Andre Destro — iOS Developer" />
  <meta property="og:description" content="Simple, fast and useful apps for everyday life." />
  <meta property="og:image" content="https://andredestro.github.io/og-image.png" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Andre Destro — iOS Developer" />
  <meta name="twitter:description" content="Simple, fast and useful apps for everyday life." />
  <meta name="twitter:image" content="https://andredestro.github.io/og-image.png" />

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f0f0f;
      color: #fff;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 60px 24px 40px;
    }

    h1 {
      font-size: 36px;
      margin: 0;
      letter-spacing: -0.5px;
    }

    p.subtitle {
      color: #888;
      margin: 0 0 48px;
      font-size: 15px;
    }

    /* Grid */
    .apps {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    @media (max-width: 600px) {
      .apps {
        grid-template-columns: 1fr;
      }
      h1 {
        font-size: 28px;
      }
    }

    /* Card */
    .card {
      background: #1a1a1a;
      border-radius: 18px;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      text-decoration: none;
      color: inherit;
      transition: background 0.15s, transform 0.15s;
      border: 1px solid #ffffff08;
    }

    .card:hover {
      background: #222;
      transform: translateY(-2px);
      border-color: #ffffff14;
    }

    .card-left {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .app-icon {
      width: 52px;
      height: 52px;
      border-radius: 12px;
      flex-shrink: 0;
      object-fit: cover;
    }

    .app-info {
      min-width: 0;
    }

    .app-title {
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .app-desc {
      font-size: 12px;
      color: #888;
      margin-top: 3px;
    }

    /* Download button */
    .btn {
      background: #0a84ff;
      color: white;
      padding: 8px 14px;
      border-radius: 20px;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      flex-shrink: 0;
      letter-spacing: 0.1px;
      transition: background 0.15s;
    }

    .btn:hover {
      background: #2196f3;
    }

    .btn.coming-soon {
      background: #2a2a2a;
      color: #666;
      cursor: default;
      pointer-events: none;
    }

    /* Social links */
    .links {
      margin-top: 48px;
      display: flex;
      gap: 20px;
    }

    .links a {
      color: #666;
      text-decoration: none;
      font-size: 14px;
      transition: color 0.15s;
    }

    .links a:hover {
      color: #fff;
    }

    .footer {
      margin-top: 32px;
      font-size: 12px;
      color: #444;
    }
  </style>
</head>

<body>
  <div class="container">

    <h1>Andre Destro</h1>
    <p class="subtitle">iOS Developer building simple, fast and useful apps for everyday life.</p>

    <div class="apps" id="apps"></div>

    <div class="links">
      <a href="https://github.com/andredestro" target="_blank" rel="noopener">GitHub</a>
      <a href="https://www.linkedin.com/in/andredestro" target="_blank" rel="noopener">LinkedIn</a>
    </div>

    <div class="footer">
      © 2026 Andre Destro
    </div>

  </div>

  <script>
    const appsContainer = document.querySelector("#apps");

    function createAppCard(app) {
      const card = document.createElement("div");
      card.className = "card";

      const cardLeft = document.createElement("div");
      cardLeft.className = "card-left";

      const icon = document.createElement("img");
      icon.className = "app-icon";
      icon.src = app.iconUrl;
      icon.alt = `${app.name} icon`;
      icon.loading = "lazy";

      const appInfo = document.createElement("div");
      appInfo.className = "app-info";

      const title = document.createElement("div");
      title.className = "app-title";
      title.textContent = app.name;

      const description = document.createElement("div");
      description.className = "app-desc";
      description.textContent = app.subtitle;

      const button = document.createElement("a");
      button.className = "btn";
      button.href = app.appStoreUrl;
      button.target = "_blank";
      button.rel = "noopener";
      button.textContent = "Download";

      appInfo.append(title, description);
      cardLeft.append(icon, appInfo);
      card.append(cardLeft, button);

      return card;
    }

    async function renderApps() {
      try {
        const response = await fetch("./apps.json");
        if (!response.ok) {
          throw new Error("Could not load apps.json");
        }

        const data = await response.json();
        appsContainer.replaceChildren(...data.apps.map(createAppCard));
      } catch (error) {
        appsContainer.textContent = "Unable to load apps.";
        console.error(error);
      }
    }

    renderApps();
  </script>
</body>
</html>
